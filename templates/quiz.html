{% extends "base.html" %}

{% block content %}
<section class="section fade-in">
    <h2 class="section-title">Ստուգիր Գիտելիքներդ</h2>
    
    <div id="quiz-container" class="quiz-box">
        <div id="quiz-ui">
            <h3 id="question-text">Բեռնվում է...</h3>
            <div id="options-container" class="options-grid"></div>
        </div>
        <div id="result-ui" class="hidden">
            <h3>Վիկտորինան ավարտվեց!</h3>
            <p id="score-text"></p>
            <button onclick="location.reload()" class="btn btn-primary">Փորձել կրկին</button>
        </div>
    </div>
</section>
{% endblock %}
