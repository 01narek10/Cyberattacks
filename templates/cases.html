{% extends "base.html" %}

{% block content %}
<section class="section fade-in">
    <div class="section-title">
        <h2>{{ t.cases_title }}</h2>
        <p>{{ t.cases_subtitle }}</p>
    </div>
    <div class="grid grid-3">
        {% for c in cyber_cases %}
        <div class="card case-card">
            <div class="case-header">
                <span class="case-badge">{{ c.type }}</span>
                <span class="case-year">{{ c.year }}</span>
            </div>
            <h3>{{ c.title }}</h3>
            <p>{{ c.description }}</p>
        </div>
        {% endfor %}
    </div>
</section>

<section class="section bg-darker">
    <div class="section-title"><h2>{{ t.cases_video_title }}</h2></div>
    <div class="video-container">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/3S-8FRKme_Y?si=JKR8kaTN5ATJCXc-" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
</section>
{% endblock %}
