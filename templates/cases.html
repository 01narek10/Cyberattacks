{% extends "base.html" %}

{% block content %}
<section class="section fade-in">
    <div class="section-title">
        <h2>{{ t.cases_title }}</h2>
        <p>{{ t.cases_subtitle }}</p>
    </div>
    <div class="grid grid-3">
        {% for c in cyber_cases %}
        <div class="card case-card">
            <div class="case-header">
                <span class="case-badge">{{ c.type }}</span>
                <span class="case-year">{{ c.year }}</span>
            </div>
            <h3>{{ c.title }}</h3>
            <p>{{ c.description }}</p>
        </div>
        {% endfor %}
    </div>
</section>

<section class="section bg-darker">
    <div class="section-title"><h2>{{ t.cases_video_title }}</h2></div>
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/k5voQjb0vcc" title="Cyber Crime" allowfullscreen></iframe>
    </div>
</section>
{% endblock %}
